services:
  # 1. Django DRF Backend Web Service (Daphne for HTTP & WebSockets)
  - type: web
    name: careconnect-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && daphne -b 0.0.0.0 -p $PORT careconnect.asgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: careconnect-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: careconnect-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: careconnect-redis
          property: connectionString

  # 2. React Admin Portal (Static Web App)
  - type: web
    name: careconnect-admin-portal
    env: static
    rootDir: admin-portal
    buildCommand: "npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Redis Cache & Message Broker
  - type: redis
    name: careconnect-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  # 3. PostgreSQL Database
  - name: careconnect-db
    databaseName: careconnect_db
    user: careconnect_user
    region: singapore
    plan: free
