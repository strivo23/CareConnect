services:
  # 1. Django DRF Backend Web Service (Daphne for HTTP & WebSockets)
  - type: web
    name: careconnect-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT careconnect.asgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: careconnect-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: careconnect-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: careconnect-redis
          property: connectionString

  # 2. Celery Background Worker
  - type: worker
    name: careconnect-celery-worker
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A careconnect worker -l info"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: careconnect-redis
          property: connectionString

  # 3. Redis Cache & Message Broker
  - type: redis
    name: careconnect-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL Database
  - name: careconnect-db
    databaseName: careconnect_db
    user: careconnect_user
    region: singapore
    plan: free
