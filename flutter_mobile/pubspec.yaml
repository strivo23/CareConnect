name: careconnect_mobile
description: CareConnect Flutter mobile client.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_svg: ^2.0.17
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  lottie: ^3.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  geolocator: ^14.0.3
  permission_handler: ^12.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  speech_to_text: ^7.4.0
  record: ^7.1.1
  path_provider: ^2.1.5
  audioplayers: ^6.1.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
